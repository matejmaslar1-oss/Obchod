<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obchod</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#262b36;
    --ink:#eef1f6; --dim:#9aa4b2; --accent:#ff6a2b; --accent2:#2bd576;
    --r:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  header{padding:20px 16px 14px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);z-index:5;
    display:flex;align-items:center;justify-content:space-between}
  h1{margin:0;font-size:19px}
  .sub{color:var(--dim);font-size:13px;margin-top:2px}
  .gear{background:none;border:none;color:var(--dim);font-size:22px;cursor:pointer;padding:4px 8px}
  main{max-width:640px;margin:0 auto;padding:14px 14px 130px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:14px;margin-bottom:12px}
  .prod{display:flex;align-items:center;gap:12px}
  .prod img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#20242e;flex-shrink:0}
  .prod .info{flex:1;min-width:0}
  .prod .name{font-size:15px;font-weight:600}
  .prod .price{color:var(--dim);font-size:13px;margin-top:2px}
  .qty{display:flex;align-items:center;gap:8px}
  .qty button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
    background:#20242e;color:var(--ink);font-size:20px;cursor:pointer}
  .qty span{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin:22px 4px 8px}
  label{display:block;font-size:13px;color:var(--dim);margin:10px 0 5px}
  input,textarea{width:100%;background:#20242e;border:1px solid var(--line);border-radius:10px;
    color:var(--ink);padding:12px;font-size:15px;font-family:inherit}
  input:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
  textarea{resize:vertical;min-height:70px}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px;
    background:rgba(15,17,21,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
  .bar .row{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .total{flex:1;font-size:17px;font-weight:700}
  .total small{display:block;color:var(--dim);font-weight:400;font-size:12px}
  .send{background:var(--accent);color:#fff;border:none;padding:14px 22px;border-radius:12px;
    font-size:16px;font-weight:700;cursor:pointer}
  .send:disabled{opacity:.45}
  .btn2{background:#20242e;border:1px solid var(--line);color:var(--ink);padding:12px;
    border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;width:100%}
  .btn-red{background:#3a1f22;border-color:#5c2a2f;color:#ff8a8a}
  .ok{text-align:center;padding:50px 20px}
  .ok .tick{width:70px;height:70px;border-radius:50%;background:var(--accent2);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:38px}
  .hidden{display:none}
  .err{color:#ff6a6a;font-size:13px;margin-top:8px}
  .muted{color:var(--dim);font-size:13px;text-align:center;padding:20px}
  .del{background:none;border:none;color:#ff7a7a;font-size:13px;cursor:pointer;padding:6px}
  .preview{width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-top:8px}
</style>
</head>
<body>

<header>
  <div>
    <h1 id="shopName">Obchod</h1>
    <div class="sub" id="shopSub">Vyberte tovar a objednajte</div>
  </div>
  <button class="gear" id="gear" title="Admin">⚙︎</button>
</header>

<main>
  <!-- VEREJNÁ STRÁNKA -->
  <div id="shop">
    <div id="products"><div class="muted">Načítavam…</div></div>

    <h2>Vaše údaje</h2>
    <div class="card">
      <label>Meno a priezvisko *</label>
      <input id="f_name" placeholder="Ján Novák">
      <label>Telefón *</label>
      <input id="f_phone" type="tel" placeholder="0901 234 567">
      <label>Adresa / mesto *</label>
      <input id="f_addr" placeholder="Hlavná 5, Košice">
      <label>Poznámka (nepovinné)</label>
      <textarea id="f_note" placeholder="Napr. prosím zavolať poobede"></textarea>
      <div id="err" class="err hidden"></div>
    </div>
  </div>

  <!-- POĎAKOVANIE -->
  <div id="done" class="ok hidden">
    <div class="tick">✓</div>
    <h1>Objednávka odoslaná!</h1>
    <p class="sub">Ozveme sa vám čo najskôr. Ďakujeme.</p>
  </div>

  <!-- ADMIN -->
  <div id="admin" class="hidden">
    <h2>Admin – pridať produkt</h2>
    <div class="card">
      <label>Názov *</label>
      <input id="a_name" placeholder="Napr. Tričko čierne">
      <label>Cena v € (0 = cena dohodou)</label>
      <input id="a_price" type="number" inputmode="decimal" placeholder="19.90">
      <label>Fotka</label>
      <input id="a_file" type="file" accept="image/*">
      <img id="a_prev" class="preview hidden">
      <div id="a_err" class="err hidden"></div>
      <div style="height:10px"></div>
      <button class="btn2" id="a_save">Pridať produkt</button>
    </div>

    <h2>Existujúce produkty</h2>
    <div id="adminList"><div class="muted">Načítavam…</div></div>

    <div style="height:16px"></div>
    <button class="btn2 btn-red" id="a_logout">Zavrieť admin</button>
  </div>
</main>

<div class="bar" id="bar">
  <div class="row">
    <div class="total">
      <span id="totalPrice">0,00 €</span>
      <small id="totalItems">0 položiek</small>
    </div>
    <button class="send" id="send" disabled>Odoslať objednávku</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ═══════════════════════════════════════════════════════════
   ⬇⬇⬇  TU VYPLŇ SVOJE ÚDAJE  ⬇⬇⬇
   ═══════════════════════════════════════════════════════════ */

// 1) SUPABASE (online úložisko produktov + fotiek) – zadarmo
//    Návod: supabase.com → New project → Settings → API
const SUPABASE_URL = "https://lzgatoapdiakbkpqoyfj.supabase.co";
const SUPABASE_KEY = "sb_publishable_VsgkguqufBKy-Nm8vGf5HQ_eaqXC9hV";

// 2) ADMIN HESLO (len ty, aby ti nikto nepridával produkty)
const ADMIN_PASS = "zmen-ma-123";

// 3) EMAIL objednávky (web3forms.com – zadarmo)
const WEB3FORMS_KEY = "2ff88480-e0bf-49c9-a7ba-230e4fe7d8c4";

// 4) TELEGRAM cinknutie na mobil (voliteľné, nechaj "" ak nechceš)
const TG_TOKEN   = "";
const TG_CHAT_ID = "";

// 5) NÁZOV obchodu (zobrazí sa hore)
const SHOP_NAME = "Obchod";
const SHOP_SUB  = "Vyberte tovar a objednajte";

/* ═══════════════════════════════════════════════════════════
   ⬆⬆⬆  ĎALEJ UŽ NETREBA NIČ MENIŤ  ⬆⬆⬆
   ═══════════════════════════════════════════════════════════ */

document.getElementById('shopName').textContent = SHOP_NAME;
document.getElementById('shopSub').textContent = SHOP_SUB;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let products = [];
let cart = {};

function eur(n){return Number(n).toFixed(2).replace('.',',')+' €';}

async function loadProducts(){
  const {data, error} = await sb.from('products')
    .select('*').order('created_at',{ascending:false});
  if(error){
    document.getElementById('products').innerHTML =
      '<div class="muted">Nepodarilo sa načítať produkty. Skontroluj Supabase údaje.</div>';
    return;
  }
  products = data || [];
  renderShop();
  if(!document.getElementById('admin').classList.contains('hidden')) renderAdmin();
}

function renderShop(){
  const wrap = document.getElementById('products');
  if(products.length===0){
    wrap.innerHTML = '<div class="muted">Zatiaľ žiadne produkty.</div>';
    updateBar(); return;
  }
  let html = '<h2>Ponuka</h2>';
  products.forEach(p=>{
    const q = cart[p.id]||0;
    html += `
    <div class="card prod">
      ${p.image_url?`<img src="${p.image_url}" alt="">`:`<img alt="">`}
      <div class="info">
        <div class="name">${esc(p.name)}</div>
        <div class="price">${Number(p.price)>0?eur(p.price):'cena dohodou'}</div>
      </div>
      <div class="qty">
        <button data-m="${p.id}">−</button>
        <span id="q${p.id}">${q}</span>
        <button data-p="${p.id}">+</button>
      </div>
    </div>`;
  });
  wrap.innerHTML = html;
  updateBar();
}

document.getElementById('products').addEventListener('click',e=>{
  const p=e.target.dataset.p, m=e.target.dataset.m;
  if(p){cart[p]=(cart[p]||0)+1;}
  if(m && cart[m]>0){cart[m]--;}
  const id=p||m;
  if(id){document.getElementById('q'+id).textContent=cart[id]||0; updateBar();}
});

function updateBar(){
  let items=0,sum=0;
  products.forEach(p=>{const q=cart[p.id]||0; items+=q; sum+=q*Number(p.price);});
  document.getElementById('totalItems').textContent=
    items+' '+(items===1?'položka':items>=2&&items<=4?'položky':'položiek');
  document.getElementById('totalPrice').textContent=eur(sum);
  document.getElementById('send').disabled=items===0;
}

/* ---------- ODOSLANIE OBJEDNÁVKY ---------- */
document.getElementById('send').addEventListener('click', async ()=>{
  const name=v('f_name'),phone=v('f_phone'),addr=v('f_addr'),note=v('f_note');
  const err=document.getElementById('err');
  if(!name||!phone||!addr){err.textContent='Vyplňte meno, telefón aj adresu.';err.classList.remove('hidden');return;}
  err.classList.add('hidden');
  const btn=document.getElementById('send'); btn.disabled=true; btn.textContent='Odosielam…';

  let sum=0,lines=[];
  products.forEach(p=>{const q=cart[p.id]||0; if(q>0){lines.push(`${q}x ${p.name}`); sum+=q*Number(p.price);}});
  const order=lines.join('\n');
  const summary=`NOVÁ OBJEDNÁVKA\nMeno: ${name}\nTelefón: ${phone}\nAdresa: ${addr}\nPoznámka: ${note||'—'}\n\nObjednávka:\n${order}\n\nSpolu: ${eur(sum)}`;

  try{
    if(WEB3FORMS_KEY && !WEB3FORMS_KEY.startsWith('SEM')){
      await fetch('https://api.web3forms.com/submit',{method:'POST',
        headers:{'Content-Type':'application/json',Accept:'application/json'},
        body:JSON.stringify({access_key:WEB3FORMS_KEY,subject:'Nová objednávka – '+name,
          from_name:'Objednávka z webu',Meno:name,Telefon:phone,Adresa:addr,
          Poznamka:note||'—',Objednavka:order,Spolu:eur(sum)})});
    }
    if(TG_TOKEN && TG_CHAT_ID){
      await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`,{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({chat_id:TG_CHAT_ID,text:summary})});
    }
    document.getElementById('shop').classList.add('hidden');
    document.getElementById('bar').classList.add('hidden');
    document.getElementById('done').classList.remove('hidden');
    window.scrollTo(0,0);
  }catch(e){
    err.textContent='Nepodarilo sa odoslať. Skúste znova.';err.classList.remove('hidden');
    btn.disabled=false; btn.textContent='Odoslať objednávku';
  }
});

/* ---------- ADMIN ---------- */
document.getElementById('gear').addEventListener('click',()=>{
  const p=prompt('Admin heslo:');
  if(p===ADMIN_PASS){ openAdmin(); }
  else if(p!==null){ alert('Nesprávne heslo.'); }
});

function openAdmin(){
  document.getElementById('shop').classList.add('hidden');
  document.getElementById('bar').classList.add('hidden');
  document.getElementById('admin').classList.remove('hidden');
  renderAdmin();
}
document.getElementById('a_logout').addEventListener('click',()=>{
  document.getElementById('admin').classList.add('hidden');
  document.getElementById('shop').classList.remove('hidden');
  document.getElementById('bar').classList.remove('hidden');
});

document.getElementById('a_file').addEventListener('change',e=>{
  const f=e.target.files[0], prev=document.getElementById('a_prev');
  if(f){prev.src=URL.createObjectURL(f); prev.classList.remove('hidden');}
});

document.getElementById('a_save').addEventListener('click', async ()=>{
  const name=v('a_name'), price=parseFloat(document.getElementById('a_price').value)||0;
  const file=document.getElementById('a_file').files[0];
  const err=document.getElementById('a_err');
  if(!name){err.textContent='Zadaj názov produktu.';err.classList.remove('hidden');return;}
  err.classList.add('hidden');
  const btn=document.getElementById('a_save'); btn.disabled=true; btn.textContent='Ukladám…';

  try{
    let image_url=null;
    if(file){
      const ext=(file.name.split('.').pop()||'jpg');
      const path=Date.now()+'.'+ext;
      const up=await sb.storage.from('Kamen').upload(path,file,{upsert:true});
      if(up.error) throw up.error;
      image_url=sb.storage.from('Kamen').getPublicUrl(path).data.publicUrl;
    }
    const ins=await sb.from('products').insert({name,price,image_url});
    if(ins.error) throw ins.error;
    document.getElementById('a_name').value='';
    document.getElementById('a_price').value='';
    document.getElementById('a_file').value='';
    document.getElementById('a_prev').classList.add('hidden');
    await loadProducts();
  }catch(e){
    err.textContent='Chyba pri ukladaní: '+(e.message||e);err.classList.remove('hidden');
  }
  btn.disabled=false; btn.textContent='Pridať produkt';
});

function renderAdmin(){
  const wrap=document.getElementById('adminList');
  if(products.length===0){wrap.innerHTML='<div class="muted">Žiadne produkty.</div>';return;}
  let html='';
  products.forEach(p=>{
    html+=`<div class="card prod">
      ${p.image_url?`<img src="${p.image_url}">`:`<img>`}
      <div class="info"><div class="name">${esc(p.name)}</div>
      <div class="price">${Number(p.price)>0?eur(p.price):'cena dohodou'}</div></div>
      <button class="del" data-del="${p.id}">Zmazať</button></div>`;
  });
  wrap.innerHTML=html;
}

document.getElementById('adminList').addEventListener('click', async e=>{
  const id=e.target.dataset.del;
  if(id && confirm('Naozaj zmazať tento produkt?')){
    await sb.from('products').delete().eq('id',id);
    await loadProducts();
  }
});

function v(id){return document.getElementById(id).value.trim();}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

loadProducts();
</script>
</body>
</html>
